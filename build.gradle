plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'
group = 'dev.nova'

repositories {
    // Add additional repositories here if your mod requires external libraries
}

dependencies {
    // Minecraft version configuration for 1.21.10
    minecraft 'com.mojang:minecraft:1.21.10'
    
    // Yarn mappings for 1.21.10 (change build version if needed, e.g., +build.2)
    mappings 'net.fabricmc:yarn:1.21.10+build.2:v2'
    
    // Fabric Loader
    modImplementation 'net.fabricmc:fabric-loader:0.16.0'

    // Uncomment if you need the standard Fabric API for 1.21.10
    // modImplementation 'net.fabricmc.fabric-api:fabric-api:0.110.0+1.21.10'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Ensures sources jar is generated alongside the build
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
